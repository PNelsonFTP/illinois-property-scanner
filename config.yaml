# Illinois Property Scanner configuration
#
# Product modes (see docs/MODES.md):
#   - Distressed          → v2_compiled.json
#   - New listings (7d)   → data/new_listings_7d.json   (include_new_listings)
#   - Homes with pools    → data/pool_listings.json     (include_pool_listings)
#   - Large land 20+ ac   → data/large_land.json        (include_large_land)
#   - Caves & bunkers     → data/caves_listings.json    (include_caves_listings)
#   - Wheaton for sale    → data/wheaton_listings.json  (include_wheaton_listings)
#
# Optional towns default ON below (Leland, Earlville, Waterman, Sheridan).
# CLI can force with --include-optional / --no-optional.
# County sweeps default OFF; parallel refresh can enable with --enable-counties.
# Large-land acreage trust rules: docs/ACREAGE.md

scan:
  radius_miles: 3
  rural_radius_miles: 6
  exclude_pending: true
  include_foreclosure_search: true
  include_land: true
  include_mobile: true
  include_optional_towns: true
  include_zip_searches: true
  include_county_searches: false  # set true for county-wide sweeps (slow / large)
  include_distress_passes: true
  include_sold_pending_checks: true
  reverify_after_compile: true
  check_listing_urls: true
  stale_hours: 48
  include_new_listings: true
  new_listings_days: 7
  include_pool_listings: true
  include_large_land: true
  include_caves_listings: true
  include_wheaton_listings: true

# All active for-sale listings in Wheaton, IL (no distress / age filters).
# Dashboard mode is all-or-nothing (no town toggles). Active status is
# verified via MLS fields, sold/pending negatives, and a live reverify.
wheaton_for_sale:
  search_location: "Wheaton, IL"
  label: "Wheaton, IL"
  radius_miles: 3
  cities: [wheaton]
  zips: ["60187", "60189"]

# Large tracts (≥20 acres) within 40 miles of Lake Holiday, IL.
# Primary inventory is Realtor/MLS via HomeHarvest (land + farm).
# LandWatch / Lands of America / Zillow land links are attached for
# cross-checking — those sites block automated scraping.
large_land:
  min_acres: 20
  radius_miles: 40
  # When MLS omits lat/lon, city-center miles are approximate — tighter gate.
  centroid_max_miles: 30
  center: "Lake Holiday, IL"
  property_types: [land, farm]
  counties:
    - "LaSalle County, IL"
    - "DeKalb County, IL"
    - "Kendall County, IL"
    - "Grundy County, IL"
    - "Lee County, IL"
  hubs:
    - "Lake Holiday, IL"
    - "Sandwich, IL"
    - "Sheridan, IL"
    - "Yorkville, IL"
    - "Ottawa, IL"
    - "DeKalb, IL"
    - "Morris, IL"
    - "Amboy, IL"

# Caves / underground bunkers / underground structures near ZIP 60189.
# Hub fetches + MLS text evidence (HomeHarvest has no keyword search).
# Drive hours ≈ haversine miles / highway_mph. Prefer ≤4h; accept ≤8h;
# strong evidence may extend to exceptional_max_hours.
caves_bunkers:
  origin_zip: "60189"
  origin_label: "Wheaton, IL (60189)"
  highway_mph: 55
  preferred_hours: 4
  max_hours: 8
  exceptional_max_hours: 12
  hub_radius_miles: 60
  states: [IL, MO, AR, KY, IN, TN, MI]
  hubs:
    - "Wheaton, IL"
    - "Chicago, IL"
    - "Rockford, IL"
    - "Peoria, IL"
    - "Springfield, IL"
    - "Champaign, IL"
    - "Carbondale, IL"
    - "St. Louis, MO"
    - "Springfield, MO"
    - "Branson, MO"
    - "Columbia, MO"
    - "Kansas City, MO"
    - "Louisville, KY"
    - "Lexington, KY"
    - "Cave City, KY"
    - "Bowling Green, KY"
    - "Indianapolis, IN"
    - "Evansville, IN"
    - "Bloomington, IN"
    - "Fort Wayne, IN"
    - "Nashville, TN"
    - "Memphis, TN"
    - "Knoxville, TN"
    - "Chattanooga, TN"
    - "Little Rock, AR"
    - "Fayetteville, AR"
    - "Detroit, MI"
    - "Grand Rapids, MI"
    - "Ann Arbor, MI"
    - "Lansing, MI"

verification:
  require_reverify: true
  sold_lookback_days: 90
  pending_lookback_days: 30
  dead_link_timeout_sec: 12
  consensus_min_sources: 1

towns:
  Wheaton:
    search_location: "Wheaton, IL"
    county: DuPage
    cities: [wheaton]
    zips: ["60187", "60189"]
    radius_miles: 3
  Oswego:
    search_location: "Oswego, IL"
    county: Kendall
    cities: [oswego, montgomery, boulder hill]
    zips: ["60543"]
    radius_miles: 3
  Sandwich:
    search_location: "Sandwich, IL"
    county: DeKalb
    cities: [sandwich]
    zips: ["60548"]
    radius_miles: 3
  Somonauk:
    search_location: "Somonauk, IL"
    county: DeKalb
    cities: [somonauk]
    zips: ["60552"]
    radius_miles: 3
  Lake Holiday:
    search_location: "Lake Holiday, IL"
    county: LaSalle
    cities: [lake holiday]
    zips: ["60548", "60552"]
    radius_miles: 3

# Optional towns — enabled when include_optional_towns is true or --include-optional
optional_towns:
  Leland:
    search_location: "Leland, IL"
    county: LaSalle
    cities: [leland]
    zips: ["60531"]
    radius_miles: 6
  Earlville:
    search_location: "Earlville, IL"
    county: LaSalle
    cities: [earlville]
    zips: ["60518"]
    radius_miles: 6
  Waterman:
    search_location: "Waterman, IL"
    county: DeKalb
    cities: [waterman]
    zips: ["60556"]
    radius_miles: 6
  Sheridan:
    search_location: "Sheridan, IL"
    county: LaSalle
    cities: [sheridan]
    zips: ["60551"]
    radius_miles: 6

# Extra county-level searches for edge parcels
counties:
  - "DeKalb County, IL"
  - "LaSalle County, IL"
  - "Kendall County, IL"

# Targeted distress query passes (beyond plain for_sale)
distress_passes:
  - name: foreclosure
    foreclosure: true
  - name: price_reduced
    # HomeHarvest has no direct price-reduced flag; we filter post-fetch
    filter: price_reduced
  - name: land
    property_type: land
  - name: mobile
    property_type: mobile

distress:
  high_dom_days: 90
  land_max_price_signal: 30000
  mobile_max_price_signal: 50000
  min_price_reduction_pct: 0.02
  # Vacant lots under this size are excluded from distressed mode (use Large land mode).
  min_land_acres_for_distress: 20
  # Reject DOM-only / price-cut-only unless composite or score meets this with a second signal.
  min_publish_score: 3

# Named refresh profiles for `python scan.py refresh {quick,daily,full}`
refresh_profiles:
  quick:
    description: Reverify distressed + refresh new listings
    reverify_only: true
    include_new_listings: true
    include_pool_listings: false
    include_large_land: false
    include_caves_listings: false
    include_wheaton_listings: false
    include_legacy: false
  daily:
    description: Parallel full discovery without county sweeps
    use_parallel: true
    enable_counties: false
    include_legacy: false
    include_new_listings: true
    include_pool_listings: true
    include_large_land: true
    include_caves_listings: true
    include_wheaton_listings: true
    include_public_records: false
  full:
    description: Parallel + counties + public-record CSV + all modes
    use_parallel: true
    enable_counties: true
    include_legacy: false
    include_new_listings: true
    include_pool_listings: true
    include_large_land: true
    include_caves_listings: true
    include_wheaton_listings: true
    include_public_records: true

inactive_statuses:
  - sold
  - closed
  - pending
  - contingent
  - under contract
  - active under contract
  - active contingent
  - off market
  - off-market
  - expired
  - withdrawn
  - cancelled
  - canceled
  - backup
  - take backup
  - kick out
  - kick-out

not_distressed_phrases:
  - not a distressed sale
  - not distressed
  - fully renovated
  - move-in ready
  - turnkey
  - newly renovated
  - completely updated
  - beautifully maintained
  - immaculate
  - like new
